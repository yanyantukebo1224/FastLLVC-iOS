name: Build FastLLVC iOS App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application for Real Device (ARM64)
    runs-on: macos-14

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build for Real iOS Device (arm64 / iphoneos)
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project FastLLVC.xcodeproj \
            -scheme FastLLVC \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build_device"

      - name: Build for iOS Simulator (x86_64 / arm64-simulator)
        working-directory: ios
        run: |
          xcodebuild build \
            -project FastLLVC.xcodeproj \
            -scheme FastLLVC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build_sim"

      - name: Package FastLLVC.ipa (Real Device) and Simulator App
        working-directory: ios
        run: |
          mkdir -p dist
          DIST_DIR="$(pwd)/dist"
          
          # 1. Package Real Device IPA (Native ARM64 for iOS 17 - iOS 27+)
          DEVICE_APP=$(find build_device -name "FastLLVC.app" -type d | head -n 1)
          if [ -n "$DEVICE_APP" ]; then
            echo "Packaging Real Device App: $DEVICE_APP"
            mkdir -p ipa_root/Payload
            cp -R "$DEVICE_APP" ipa_root/Payload/
            (cd ipa_root && zip -r "${DIST_DIR}/FastLLVC.ipa" Payload)
            rm -rf ipa_root
          fi

          # 2. Package Simulator App (for Xcode / Simulators)
          SIM_APP=$(find build_sim -name "FastLLVC.app" -type d | head -n 1)
          if [ -n "$SIM_APP" ]; then
            echo "Packaging Simulator App: $SIM_APP"
            sim_dir=$(dirname "$SIM_APP")
            (cd "$sim_dir" && zip -r "${DIST_DIR}/FastLLVC-Simulator.zip" FastLLVC.app)
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastLLVC-iOS-Release
          path: |
            ios/dist/FastLLVC.ipa
            ios/dist/FastLLVC-Simulator.zip
          retention-days: 14

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 ios/dist/FastLLVC.ipa ios/dist/FastLLVC-Simulator.zip --clobber || \
          gh release create v1.0.0 ios/dist/FastLLVC.ipa ios/dist/FastLLVC-Simulator.zip --title "Fast-LLVC iOS v1.0.0" --notes "Fast-LLVC for iOS (iOS 17 ~ iOS 27+ Real Device Native ARM64 & Simulator)" || true
