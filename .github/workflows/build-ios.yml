name: Build FastLLVC iOS App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application (Xcode)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: List Xcode Project Schemes
        working-directory: ios
        run: |
          xcodebuild -list -project FastLLVC.xcodeproj

      - name: Build iOS App with xcodebuild (Release)
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project FastLLVC.xcodeproj \
            -scheme FastLLVC \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build"

      - name: Package App Bundle & IPA
        working-directory: ios
        run: |
          mkdir -p dist
          find build -name "FastLLVC.app" -type d | while read app_path; do
            echo "Found app at: $app_path"
            app_dir=$(dirname "$app_path")
            app_name=$(basename "$app_path")
            (cd "$app_dir" && zip -r "../../dist/FastLLVC-iOS-Release.zip" "$app_name")
            
            # Create standard IPA package
            mkdir -p /tmp/ipa_temp/Payload
            cp -r "$app_path" /tmp/ipa_temp/Payload/
            (cd /tmp/ipa_temp && zip -r "../../dist/FastLLVC.ipa" Payload)
            rm -rf /tmp/ipa_temp
            break
          done

      - name: Upload FastLLVC iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastLLVC-iOS-Release
          path: |
            ios/dist/FastLLVC-iOS-Release.zip
            ios/dist/FastLLVC.ipa
          retention-days: 14
          if-no-files-found: warn
